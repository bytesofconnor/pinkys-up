name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          BODY
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          BODY

      - name: Check this PR body
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Test auto-merge policy
        run: node --test .github/policy/automerge-policy.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test inquiry parser
        run: node --test lib/inquiry.test.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npx playwright test
